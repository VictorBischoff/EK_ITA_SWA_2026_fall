name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Import server.py and scripts/auto_update.py
        run: |
          python -c "import server"
          python -c "import sys; sys.path.insert(0, 'scripts'); import auto_update"

      - name: Byte-compile all Python files
        run: python -m py_compile server.py scripts/auto_update.py
